spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: Asia/Seoul
  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  server:
    servlet:
      context-path: ${SPRING_SERVER_SERVLET_CONTEXT_PATH}

  springdoc:
    swagger-ui:
      path: /swagger
      groups-order: DESC
      tags-sorter: alpha
      operations-sorter: method

jwt:
  secret-key: ${SECRET_KEY}